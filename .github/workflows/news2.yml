name: ForG 뉴스 알림

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"   # 첫 번째 봇과 시간이 겹치지 않게 어긋나게 설정
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot-2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: 새 글 확인 및 전송
        run: python news_bot2.py
        env:
          DISCORD_WEBHOOK_2: ${{ secrets.DISCORD_WEBHOOK_2 }}

      - name: 확인한 글 기록 저장
        run: |
          git config user.name "ash-bot"
          git config user.email "ash-bot@users.noreply.github.com"
          git add seen2.json
          git diff --cached --quiet || (git commit -m "update seen2" && git pull --rebase -X theirs && git push || (sleep 5 && git pull --rebase -X theirs && git push))
